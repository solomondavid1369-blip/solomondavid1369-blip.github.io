<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="Web portfolio project preview on a laptop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16213e"/>
      <stop offset="1" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243247"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#e94560" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e94560" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="300" fill="url(#bg)"/>
  <circle cx="240" cy="150" r="150" fill="url(#glow)"/>
  <!-- laptop screen bezel -->
  <rect x="96" y="34" width="288" height="184" rx="14" fill="#05080d" stroke="#2a3b52" stroke-width="2"/>
  <circle cx="240" cy="45" r="2.4" fill="#3a5566"/>
  <!-- screen -->
  <rect x="108" y="56" width="264" height="150" rx="6" fill="#0a1815"/>
  <!-- mini site: top nav -->
  <rect x="108" y="56" width="264" height="22" rx="6" fill="#0c221d"/>
  <rect x="122" y="63" width="34" height="8" rx="3" fill="#159C8E"/>
  <rect x="300" y="64" width="18" height="6" rx="3" fill="#2f5a52"/>
  <rect x="324" y="64" width="18" height="6" rx="3" fill="#2f5a52"/>
  <rect x="348" y="64" width="14" height="6" rx="3" fill="#159C8E"/>
  <!-- hero heading + text -->
  <rect x="124" y="96" width="120" height="12" rx="4" fill="#C5F2E4"/>
  <rect x="124" y="114" width="92" height="10" rx="4" fill="#159C8E"/>
  <rect x="124" y="136" width="140" height="6" rx="3" fill="#24413b"/>
  <rect x="124" y="148" width="120" height="6" rx="3" fill="#24413b"/>
  <!-- accent button -->
  <rect x="124" y="166" width="60" height="18" rx="5" fill="#159C8E"/>
  <!-- portrait card on the right with node hint -->
  <rect x="286" y="96" width="70" height="90" rx="8" fill="#0e211c" stroke="#159C8E" stroke-opacity="0.5"/>
  <circle cx="321" cy="131" r="16" fill="none" stroke="#159C8E" stroke-opacity="0.7" stroke-width="2"/>
  <circle cx="321" cy="126" r="5" fill="#159C8E" fill-opacity="0.8"/>
  <path d="M311 146a10 8 0 0 1 20 0" fill="#159C8E" fill-opacity="0.5"/>
  <!-- laptop base -->
  <path d="M64 218 L416 218 L446 246 L34 246 Z" fill="url(#base)" stroke="#2a3b52" stroke-width="1.5"/>
  <rect x="214" y="222" width="52" height="6" rx="3" fill="#0d1526"/>
</svg>
